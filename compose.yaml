# AudiobookCast — onboarded into Valet.
#
# Class: user-/client-triggered backend, used rarely -> on-demand (scale-to-zero).
# Sablier suspends it when idle and wakes it on the next request, so it costs nothing
# the ~99% of the time it isn't being touched.
#
# WAKE STRATEGY — blocking, not the default loading page. This app is polled by podcast
# apps (RSS feeds + MP3 enclosures), which are not browsers: the default Sablier
# "dynamic" strategy would answer a cold request with an HTML loading page and break the
# feed/download. The `blocking` strategy below instead holds the request open for up to
# `blocking.timeout` while the container wakes (~a few seconds), then forwards the real
# request. Browsers hitting the web UI cold just wait briefly too.
#
# ROUTING — host-based, NOT a path prefix. The UI and feeds hardcode root-relative paths
# (`/api/...`, `/books/:id/feed`, `/opds`), so serving under `/audiobookcast` with a
# stripprefix would break them. Instead it owns a hostname. `*.<ip>.nip.io` resolves to
# that IP with zero DNS setup, so `audiobooks.192.168.10.9.nip.io` -> 192.168.10.9 (the
# Valet host). Swap this for a real hostname (router DNS / Pi-hole / Tailscale) anytime —
# it's one rule + the HOSTNAME env below.
#
# HOSTNAME must be the address podcast apps actually reach, because every RSS
# enclosure/cover URL is built from it.
#
# NOTE: these labels are a hand-maintained equivalent of the `just mode` managed block.
# Running `just mode audiobookcast ...` would REGENERATE this block as a path-prefixed,
# loading-page app and undo both the Host() rule and the blocking strategy. If you ever
# do, re-apply this file afterward.
services:
  audiobookcast:
    build: ./apps/audiobookcast
    networks:
      - valet
    environment:
      - PORT=4500
      - AUDIOBOOKS_PATH=/app/audiobooks
      - HOSTNAME=http://audiobooks.192.168.10.9.nip.io
    volumes:
      # The library is read-only to the app (it only scans/serves it). All writes
      # (tags.json, metadata cache, AI enrichment) go to /app/data.
      - audiobookcast-library:/app/audiobooks:ro
      - audiobookcast-data:/app/data
    # No /health endpoint; the root page is a fine readiness signal. Lets Sablier detect
    # when the container is actually up after a wake.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4500/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # >>> valet:managed (hand-maintained — see header note; `just mode` would overwrite)
    labels:
      - valet.type=service
      - valet.mode=on-demand
      - valet.route=audiobookcast
      - traefik.enable=true
      - traefik.docker.allownonrunning=true
      - traefik.http.routers.audiobookcast.rule=Host(`audiobooks.192.168.10.9.nip.io`)
      - traefik.http.routers.audiobookcast.entrypoints=web
      - traefik.http.routers.audiobookcast.middlewares=audiobookcast-sablier
      - traefik.http.services.audiobookcast.loadbalancer.server.port=4500
      - sablier.enable=true
      - sablier.group=audiobookcast
      - traefik.http.middlewares.audiobookcast-sablier.plugin.sablier.group=audiobookcast
      - traefik.http.middlewares.audiobookcast-sablier.plugin.sablier.sablierUrl=http://sablier:10000
      - traefik.http.middlewares.audiobookcast-sablier.plugin.sablier.sessionDuration=15m
      - traefik.http.middlewares.audiobookcast-sablier.plugin.sablier.blocking.timeout=1m
    # <<< valet:managed

networks:
  valet:
    external: true

volumes:
  # NFS mount of the audiobook library on the NAS. Mounted by the Valet host (.9), which
  # must be able to reach the NAS — reachability from a dev box is irrelevant.
  # If the mount fails: try `nfsvers=4` instead of 3, and double-check the export path
  # (it contains a space: "Audio Books"). Add `,soft` to fail fast if the NAS is down
  # (default `hard` retries forever, which is safer for streaming but hangs on outage).
  audiobookcast-library:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.10.24,ro,nfsvers=3"
      device: ":/mnt/user/Media/Audio Books"
  # Persistent app state (tags, metadata cache, enrichment). Survives rebuilds.
  audiobookcast-data:
