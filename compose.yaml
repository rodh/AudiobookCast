# AudiobookCast — onboarded into Valet.
#
# Class: user-/client-triggered backend, but ALWAYS-ON. It's accessed from a phone and
# polled by podcast apps (RSS feeds + MP3 enclosures) that won't tolerate a slow/failed
# cold start. It was tried as scale-to-zero (Sablier), but cold wakes returned HTTP 500
# via the Sablier Traefik plugin (~10s timeout in its wake path, independent of
# blocking.timeout), breaking phone/podcast access. Idle cost is ~64MB, so it stays
# resident. See the managed block below for how to switch back to scale-to-zero.
#
# ROUTING — host-based, NOT a path prefix. The UI and feeds hardcode root-relative paths
# (`/api/...`, `/books/:id/feed`, `/opds`), so serving under `/audiobookcast` with a
# stripprefix would break them. Instead it owns a hostname. `*.<ip>.nip.io` resolves to
# that IP with zero DNS setup, so `audiobooks.192.168.10.12.nip.io` -> 192.168.10.12 (the
# Valet host). Swap this for a real hostname (router DNS / Pi-hole / Tailscale) anytime —
# it's one rule + the HOSTNAME env below.
#
# HOSTNAME must be the address podcast apps actually reach, because every RSS
# enclosure/cover URL is built from it.
#
# NOTE: the managed block is hand-maintained. Running `just mode audiobookcast ...` would
# REGENERATE it as a path-prefixed app and undo the Host() rule, so don't — edit it here.
services:
  audiobookcast:
    build: ./apps/audiobookcast
    networks:
      - valet
    environment:
      - PORT=4500
      - AUDIOBOOKS_PATH=/app/audiobooks
      - HOSTNAME=http://audiobooks.192.168.10.12.nip.io
    volumes:
      # The library is read-only to the app (it only scans/serves it). All writes
      # (tags.json, metadata cache, AI enrichment) go to /app/data.
      - audiobookcast-library:/app/audiobooks:ro
      - audiobookcast-data:/app/data
    # No /health endpoint; the root page is a fine readiness signal. Drives the dashboard
    # status and lets Docker restart it if it wedges. The app listens immediately (serves
    # the persisted library and rescans in the background), so it's healthy within seconds.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4500/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # >>> valet:managed (hand-maintained — see header note; `just mode` would overwrite)
    # always-on: a media server hit from a phone and polled by podcast apps wants an
    # immediate, reliable response. Scale-to-zero cold wakes here returned HTTP 500 (the
    # Sablier Traefik plugin has a ~10s timeout in its wake path, independent of
    # blocking.timeout), which broke phone/podcast access. Idle cost is ~64MB, so resident
    # is the right trade. To go back to scale-to-zero, restore the on-demand label set
    # (valet.mode=on-demand, allownonrunning, the -sablier middleware + sablier.* labels)
    # and drop `restart: unless-stopped` — do it by hand, NOT `just mode` (that would also
    # clobber the Host() rule).
    restart: unless-stopped
    labels:
      - valet.type=service
      - valet.mode=always-on
      - valet.route=audiobookcast
      - traefik.enable=true
      - traefik.http.routers.audiobookcast.rule=Host(`audiobooks.192.168.10.12.nip.io`)
      - traefik.http.routers.audiobookcast.entrypoints=web
      - traefik.http.services.audiobookcast.loadbalancer.server.port=4500
    # <<< valet:managed

networks:
  valet:
    external: true

volumes:
  # SMB/CIFS mount of the audiobook library: the //192.168.10.24/Media share, "Audio Books"
  # subfolder. The share allows guest read, so no credentials are stored here. Mounted by
  # the Valet host, which must reach the NAS over SMB (port 445).
  # If the mount fails: try `vers=2.1` or `vers=3.1.1` instead of 3.0. If guest read is ever
  # turned off on the share, add `username=${SMB_USER},password=${SMB_PASSWORD}` here and put
  # those in the gitignored .env at the Valet root (compose interpolates them — they stay out
  # of this committed repo).
  audiobookcast-library:
    driver: local
    driver_opts:
      type: cifs
      o: "ro,guest,vers=3.0,iocharset=utf8"
      device: "//192.168.10.24/Media/Audio Books"
  # Persistent app state (tags, metadata cache, enrichment). Survives rebuilds.
  audiobookcast-data:
