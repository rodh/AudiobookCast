<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Audio Books</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-toggleable-md navbar-inverse bg-inverse fixed-top">
    <a class="navbar-brand" href="#">Audio Books</a>
  </nav>

  <div class="container-fluid" style="margin-top: 5rem; text-align: center;">
    <div id="books-container"></div>
  </div>

  <script>
    async function loadBooks() {
      const res = await fetch('/api/books');
      const books = await res.json();
      const container = document.getElementById('books-container');

      for (const book of books) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="/books/${book.id}/cover" class="card-img-top img-fluid" alt="${book.title}" onerror="this.style.display='none'">
          <div class="card-block">
            <h4 class="card-title">${book.title}</h4>
            <a href="/books/${book.id}/feed" class="card-link btn btn-secondary btn-sm" onclick="copyFeedUrl(event, this)">RSS Feed</a>
            <a href="/opds" class="card-link btn btn-outline-secondary btn-sm" onclick="copyFeedUrl(event, this)">OPDS</a>
          </div>
        `;
        container.appendChild(card);
      }
    }

    function copyFeedUrl(event, link) {
      event.preventDefault();
      const feedUrl = link.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(feedUrl).then(() => showCopied(link));
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = feedUrl;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showCopied(link);
      }
    }

    function showCopied(link) {
      const originalText = link.textContent;
      link.textContent = 'Copied!';
      setTimeout(() => { link.textContent = originalText; }, 1500);
    }
    loadBooks();
  </script>
</body>
</html>
