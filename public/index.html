<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Audio Books</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">Audio Books</a>
    <div class="navbar-controls">
      <input type="text" id="search-input" class="form-control form-control-sm" placeholder="Search title or author...">
      <select id="sort-select" class="form-control form-control-sm">
        <option value="added">Date Added</option>
        <option value="title">Title A-Z</option>
        <option value="duration">Duration</option>
      </select>
      <a href="/opds" class="btn btn-outline-light btn-sm btn-opds" onclick="copyFeedUrl(event, this)">OPDS Catalog</a>
    </div>
  </nav>

  <div class="main-layout">
    <aside class="tags-sidebar" id="tags-sidebar"></aside>
    <div class="content-area">
      <div id="books-container"></div>
    </div>
  </div>

  <script>
    let allBooks = [];
    let allTags = [];
    let activeTag = null;

    function debounce(fn, ms) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), ms);
      };
    }

    function formatDuration(seconds) {
      if (!seconds) return '';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }

    function renderTags() {
      const sidebar = document.getElementById('tags-sidebar');
      if (!allTags.length) {
        sidebar.style.display = 'none';
        return;
      }
      sidebar.style.display = 'block';
      sidebar.innerHTML = '<h6 class="tags-heading">Tags</h6>' +
        allTags.map(t =>
          `<button class="tag-pill${activeTag === t.name ? ' active' : ''}" onclick="toggleTag('${t.name.replace(/'/g, "\\'")}')">${t.name} <span class="tag-count">${t.count}</span></button>`
        ).join('');
    }

    function renderBooks() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const sort = document.getElementById('sort-select').value;

      let books = allBooks;

      if (q) {
        books = books.filter(b =>
          b.title.toLowerCase().includes(q) ||
          (b.author && b.author.toLowerCase().includes(q))
        );
      }

      if (activeTag) {
        books = books.filter(b => b.tags.some(t => t.toLowerCase() === activeTag.toLowerCase()));
      }

      if (sort === 'title') {
        books = [...books].sort((a, b) => a.title.localeCompare(b.title));
      } else if (sort === 'duration') {
        books = [...books].sort((a, b) => b.totalDuration - a.totalDuration);
      } else {
        books = [...books].sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));
      }

      const container = document.getElementById('books-container');

      if (!books.length) {
        container.innerHTML = '<div class="no-results">No audiobooks match your search.</div>';
        return;
      }

      container.innerHTML = books.map(book => `
        <div class="card">
          <img src="/books/${book.id}/cover" class="card-img-top img-fluid" alt="${book.title}" onerror="this.style.display='none'">
          <div class="card-block">
            <h4 class="card-title">${book.title}</h4>
            ${book.author ? `<p class="card-author">${book.author}</p>` : ''}
            ${book.totalDuration ? `<p class="card-duration">${formatDuration(book.totalDuration)}</p>` : ''}
            <a href="/books/${book.id}/feed" class="card-link btn btn-secondary btn-sm" onclick="copyFeedUrl(event, this)">RSS Feed</a>
          </div>
        </div>
      `).join('');
    }

    function toggleTag(name) {
      activeTag = activeTag === name ? null : name;
      renderTags();
      renderBooks();
    }

    function copyFeedUrl(event, link) {
      event.preventDefault();
      const feedUrl = link.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(feedUrl).then(() => showCopied(link));
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = feedUrl;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showCopied(link);
      }
    }

    function showCopied(link) {
      const originalText = link.textContent;
      link.textContent = 'Copied!';
      setTimeout(() => { link.textContent = originalText; }, 1500);
    }

    document.getElementById('search-input').addEventListener('input', debounce(renderBooks, 200));
    document.getElementById('sort-select').addEventListener('change', renderBooks);

    async function loadBooks() {
      const booksRes = await fetch('/api/books');
      allBooks = await booksRes.json();
      renderBooks();

      try {
        const tagsRes = await fetch('/api/tags');
        allTags = await tagsRes.json();
        renderTags();
      } catch (e) {
        console.error('Failed to load tags:', e);
      }
    }

    loadBooks();
  </script>
</body>
</html>
